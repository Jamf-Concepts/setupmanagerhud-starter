app = "setupmanagerhud"
primary_region = "lhr"

[build]

[env]
  DB_PATH = "/data/hud.sqlite"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "hud_data"
  destination = "/data"
